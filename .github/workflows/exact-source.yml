name: Exact-source PostHog validation
on:
  push:
    branches: [ci/swordhitbox-exact-source]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        node: [1.21.9-fabric, 1.21.9-neoforge, 1.21.10-fabric, 1.21.10-neoforge, 1.21.11-fabric, 1.21.11-neoforge, 26.1.1-fabric, 26.1.1-neoforge, 26.1.2-fabric, 26.1.2-neoforge, 26.2-fabric]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c377355f5aa7fe7bc371daa4797db3c4fecec781
          persist-credentials: false
      - name: Verify exact product source
        run: |
          test "$(git rev-parse HEAD)" = c377355f5aa7fe7bc371daa4797db3c4fecec781
          test -z "$(git status --porcelain)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and test exact source (no publishing)
        shell: bash
        env:
          NODE: ${{ matrix.node }}
        run: |
          if [[ "$NODE" == 26.*-fabric ]]; then
            export JAVA_HOME="$JAVA_HOME_25_X64"
          else
            export JAVA_HOME="$JAVA_HOME_21_X64"
          fi
          export PATH="$JAVA_HOME/bin:$PATH"
          ./gradlew --no-daemon --no-parallel --max-workers=1 \
            '-Dorg.gradle.jvmargs=-Xmx1g' \
            "-Dorg.gradle.java.installations.paths=$JAVA_HOME_21_X64,$JAVA_HOME_25_X64" \
            ":$NODE:build" ":$NODE:test" --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.node }}
          path: |
            versions/${{ matrix.node }}/build/libs/*.jar
            versions/${{ matrix.node }}/build/reports/
            versions/${{ matrix.node }}/build/test-results/
          if-no-files-found: warn
  exact-source-status:
    if: always()
    needs: build
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        with:
          script: |
            const ok = process.env.BUILD_RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: 'c377355f5aa7fe7bc371daa4797db3c4fecec781',
              state: ok ? 'success' : 'failure',
              context: 'SwordHitbox / exact-source 11-target build and test',
              description: ok ? 'All 11 exact-source builds/tests passed' : 'Exact-source matrix did not pass',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (!ok) core.setFailed('Build matrix result: ' + process.env.BUILD_RESULT);
